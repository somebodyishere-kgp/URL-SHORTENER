services:
  - type: web
    name: url-shortener-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build:api
    startCommand: npm run api:start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PUBLIC_BASE_URL
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: TIMESCALE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: ANALYTICS_DRIVER
        value: direct
      - key: RUN_WORKER_IN_API
        value: false
      - key: CACHE_TTL_SECONDS
        value: 3600
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: 60
      - key: RATE_LIMIT_MAX_REQUESTS
        value: 120
