services:
  postgres:
    build:
      context: ./db/postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: url_shortener
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  timescaledb:
    build:
      context: ./db/timescale
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: url_analytics
    ports:
      - "5433:5432"
    volumes:
      - timescale-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/url_shortener
      TIMESCALE_URL: postgres://postgres:postgres@timescaledb:5432/url_analytics
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - timescaledb
      - redis
    ports:
      - "4000:4000"

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: npm run worker:start -w apps/api
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/url_shortener
      TIMESCALE_URL: postgres://postgres:postgres@timescaledb:5432/url_analytics
      REDIS_URL: redis://redis:6379
    depends_on:
      - api
      - timescaledb
      - redis

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      VITE_API_BASE_URL: http://localhost:4000
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  postgres-data:
  timescale-data:
  redis-data:
